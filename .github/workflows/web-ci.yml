name: web-ci

on:
  push:
    branches: [main, develop, stage]
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "packages/contracts-auth/**"
      - ".github/workflows/web-ci.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.base.json"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Detect relevant changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - "apps/web/**"
              - "packages/ui/**"
              - "packages/contracts-auth/**"
              - ".github/workflows/web-ci.yml"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "turbo.json"
              - "tsconfig.base.json"

      - name: Checkout
        if: steps.changes.outputs.web == 'true'
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: steps.changes.outputs.web == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: steps.changes.outputs.web == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.changes.outputs.web == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        if: steps.changes.outputs.web == 'true'
        run: pnpm --filter @apps/web exec playwright install --with-deps chromium

      - name: Web typecheck
        if: steps.changes.outputs.web == 'true'
        run: pnpm --filter @apps/web typecheck

      - name: Web unit/integration tests
        if: steps.changes.outputs.web == 'true'
        run: pnpm --filter @apps/web test

      - name: Web e2e tests
        if: steps.changes.outputs.web == 'true'
        run: pnpm --filter @apps/web test:e2e

      - name: Skip (no web changes)
        if: steps.changes.outputs.web != 'true'
        run: echo "No web-related changes detected; skipping heavy checks."

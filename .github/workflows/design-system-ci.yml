name: design-system-ci

on:
  push:
    branches: [main, develop, stage]
    paths:
      - "apps/storybook/**"
      - "packages/ui/**"
      - ".github/workflows/design-system-ci.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.base.json"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: design-system-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-system-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Detect relevant changes
        id: changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            design_system:
              - "apps/storybook/**"
              - "packages/ui/**"
              - ".github/workflows/design-system-ci.yml"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "turbo.json"
              - "tsconfig.base.json"

      - name: Checkout
        if: steps.changes.outputs.design_system == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        if: steps.changes.outputs.design_system == 'true'
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0

      - name: Setup Node
        if: steps.changes.outputs.design_system == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.changes.outputs.design_system == 'true'
        run: pnpm install --frozen-lockfile

      - name: UI typecheck
        if: steps.changes.outputs.design_system == 'true'
        run: pnpm --filter @repo/ui typecheck

      - name: Storybook typecheck
        if: steps.changes.outputs.design_system == 'true'
        run: pnpm --filter @repo/storybook typecheck

      - name: Storybook tests
        if: steps.changes.outputs.design_system == 'true'
        run: pnpm --filter @repo/storybook test

      - name: Storybook build
        if: steps.changes.outputs.design_system == 'true'
        run: pnpm --filter @repo/storybook build-storybook

      - name: Skip (no design-system changes)
        if: steps.changes.outputs.design_system != 'true'
        run: echo "No design-system changes detected; skipping heavy checks."

name: backend-ci

on:
  push:
    branches: [main, develop, stage]
    paths:
      - "apps/api/**"
      - "packages/contracts-auth/**"
      - ".github/workflows/backend-ci.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "docker-compose.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - name: Checkout (push events)
        if: github.event_name != 'pull_request'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            backend:
              - "apps/api/**"
              - "packages/contracts-auth/**"
              - ".github/workflows/backend-ci.yml"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "turbo.json"
              - "docker-compose.yml"

  api-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://kami:ilovekami@localhost:5432/taste_spec_kit
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kami
          POSTGRES_PASSWORD: ilovekami
          POSTGRES_DB: taste_spec_kit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kami -d taste_spec_kit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @apps/api typecheck

      - name: Policy guards
        run: pnpm --filter @apps/api check:guards

      - name: Lint
        run: pnpm --filter @apps/api lint

      - name: Unit tests
        run: pnpm --filter @apps/api test:unit

      - name: Integration tests
        run: pnpm --filter @apps/api test:integration

      - name: E2E tests
        run: pnpm --filter @apps/api test:e2e

  skip-backend-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Skip (no backend changes)
        run: echo "No backend-related changes detected; skipping heavy checks."

  backend-check:
    needs: [detect-changes, api-check, skip-backend-check]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate required backend check
        run: |
          if [ "${{ needs.detect-changes.outputs.backend }}" = "true" ]; then
            if [ "${{ needs.api-check.result }}" != "success" ]; then
              echo "Backend changes were detected but api-check did not succeed."
              exit 1
            fi
            echo "Backend changes detected and api-check succeeded."
          else
            echo "No backend changes detected; backend check passes."
          fi
